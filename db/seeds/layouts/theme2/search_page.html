{{ define "client-content" }}
<main class="theme2-page max-w-7xl mx-auto px-4 sm:px-6 py-8">
  <div class="grid lg:grid-cols-3 gap-10">
    <div id="public-root" class="public-root lg:col-span-2 space-y-8 animate-fadeUp">
      <div class="blog-feed-head">
        <h1 class="text-xs font-sans font-bold uppercase tracking-widest text-gray-900 pl-3 border-l-4 border-accent mb-2">Arsip</h1>
        <p class="font-serif text-2xl sm:text-3xl font-bold text-gray-900">Semua postingan</p>
      </div>
      {{ if .posts }}
        {{ template "client-topic-posts-list" . }}
        {{ template "client-pagination" . }}
      {{ else }}
        <p class="text-gray-600 font-sans">Belum ada artikel yang dipublikasikan.</p>
      {{ end }}
    </div>
    {{ template "client-blog-sidebar-ssr" . }}
  </div>
</main>
<script>
  (function () {
    function toHourRelativeText(raw) {
      var orig = String(raw || "").trim();
      if (!orig) return "";
      var s = orig.toLowerCase();
      if (/\d+\s*hari lalu/i.test(orig)) return orig;
      if (/\d+\s*bulan lalu/i.test(orig)) return orig;
      if (/\d+\s*tahun lalu/i.test(orig)) return orig;
      var m = s.match(/^(\d+)\s*menit/);
      if (m) return m[1] + " menit lalu";
      m = s.match(/^(\d+)\s*jam/);
      if (m) {
        var h = parseInt(m[1], 10);
        if (h >= 24) {
          var d = Math.max(1, Math.floor(h / 24));
          return d + " hari lalu";
        }
        return h + " jam lalu";
      }
      return orig;
    }

    function normalizeTimeLabels(scope) {
      var root = scope || document;
      var times = root.querySelectorAll(".blog-posts-time, .blog-popular-meta");
      times.forEach(function (el) {
        el.textContent = toHourRelativeText(el.textContent);
      });
    }

    var list = document.querySelector("#public-root .blog-posts-list");
    normalizeTimeLabels(document);
    if (!list) return;
    function bindThumbSkeleton(scope) {
      var root = scope || list;
      root.querySelectorAll("[data-thumb-skeleton]").forEach(function (thumb) {
        var img = thumb.querySelector("img");
        if (!img) {
          thumb.classList.remove("blog-posts-thumb--loading");
          thumb.classList.remove("blog-media--img-loading");
          return;
        }
        function done() {
          thumb.classList.remove("blog-posts-thumb--loading");
          thumb.classList.remove("blog-media--img-loading");
        }
        if (img.complete) {
          done();
          return;
        }
        img.addEventListener("load", done, { once: true });
        img.addEventListener("error", done, { once: true });
      });
    }
    bindThumbSkeleton(list);
    if (window.ClientBindPageImg) {
      window.ClientBindPageImg(list);
    }
  })();
</script>
{{ end }}
