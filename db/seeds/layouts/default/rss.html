{{ define "client-content" }}
<main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 animate-fadeUp">
  <header class="mb-8">
    <div class="flex items-center gap-4 mb-3">
      <h1 class="text-3xl font-bold tracking-tight">RSS Feeds</h1>
      <div class="h-px bg-yellow-400 flex-1 hidden sm:block" aria-hidden="true"></div>
    </div>
    <p class="text-gray-600 font-sans text-sm sm:text-base max-w-2xl">
      Daftar feed RSS yang tersedia berdasarkan kategori.
    </p>
  </header>

  <div class="bg-white rounded-xl border border-gray-300 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full min-w-[640px] text-sm border-collapse">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200">
            <th
              scope="col"
              class="px-4 sm:px-6 py-3 text-left text-xs font-bold uppercase tracking-wide text-gray-500 font-sans w-32"
            >
              Type
            </th>
            <th
              scope="col"
              class="px-4 sm:px-6 py-3 text-left text-xs font-bold uppercase tracking-wide text-gray-500 font-sans"
            >
              Name
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          {{ range .rss_rows }}
          <tr class="hover:bg-gray-50/80 transition-colors">
            <td class="px-4 sm:px-6 py-4 align-top">
              {{ if eq .Type "Category" }}
              <span
                class="inline-flex items-center rounded px-2 py-0.5 text-[11px] font-bold uppercase tracking-wide font-sans bg-yellow-100 text-yellow-800"
              >
                {{ .Type }}
              </span>
              {{ else }}
              <span
                class="inline-flex items-center rounded px-2 py-0.5 text-[11px] font-bold uppercase tracking-wide font-sans bg-blue-100 text-blue-800"
              >
                {{ .Type }}
              </span>
              {{ end }}
            </td>
            <td class="px-4 sm:px-6 py-4 align-top">
              <a
                href="{{ .URL }}"
                target="_blank"
                rel="noopener noreferrer"
                class="group inline text-inherit no-underline"
              >
                <span class="font-semibold text-gray-900 group-hover:text-yellow-700 transition-colors">
                  {{ .Name }}
                </span>
                <span class="text-gray-300 mx-1.5 select-none" aria-hidden="true">┬╖</span>
                <span class="text-gray-500 font-sans text-xs sm:text-sm break-all group-hover:text-gray-700 transition-colors">
                  {{ .URL }}
                </span>
              </a>
            </td>
          </tr>
          {{ end }}
        </tbody>
      </table>
    </div>
  </div>
</main>
{{ end }}
