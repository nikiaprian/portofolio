{{ define "client-blog-sidebar-ssr" }}
<aside
  class="blog-popular-wrap blog-popular-wrap-sticky lg:border-l lg:border-gray-300 lg:pl-8"
  id="blog-popular-wrap"
  aria-label="Artikel populer"
  data-sidebar-ssr="1"
  data-sidebar-list-limit-popular="{{ if .sidebar_list_limit_popular }}{{ .sidebar_list_limit_popular }}{{ else if .sidebar_list_limit }}{{ .sidebar_list_limit }}{{ else }}5{{ end }}"
  data-sidebar-list-limit-latest="{{ if .sidebar_list_limit_latest }}{{ .sidebar_list_limit_latest }}{{ else if .sidebar_list_limit }}{{ .sidebar_list_limit }}{{ else }}5{{ end }}"
>
  <div class="space-y-8">
    {{ if .ads_sidebar }}
    <div class="site-ad site-ad--sidebar">{{ .ads_sidebar }}</div>
    {{ end }}
    <section
      class="blog-popular blog-popular--latest rounded-xl border border-gray-300 bg-white p-5 sm:p-6"
      aria-label="Artikel terkini"
    >
      <div class="flex items-center gap-4 mb-4">
        <h2 class="blog-popular-heading text-2xl font-bold shrink-0">Artikel Terkini</h2>
        <div class="h-px bg-yellow-400 flex-1 min-w-[2rem]"></div>
      </div>
      <ol class="blog-popular-list space-y-0" id="blog-latest-list">
        {{ range $i, $p := .latest_posts }}
        <li class="blog-popular-item">
          <a
            class="blog-popular-link flex items-start gap-3 py-3.5{{ if lt $i 4 }} border-b border-gray-200{{ end }} group"
            href="{{ $p.href }}"
          >
            <span
              class="w-7 shrink-0 text-lg font-extrabold text-gray-400 group-hover:text-yellow-600 transition leading-none tabular-nums text-right mt-0.5"
              >#{{ $p.rank }}</span
            >
            <div class="min-w-0 flex-1">
              <span
                class="blog-popular-title block text-sm font-bold leading-snug group-hover:text-yellow-700 transition"
                >{{ $p.title }}</span
              >
              {{ if $p.time }}<span
                class="blog-popular-meta mt-1 block text-xs text-gray-500 font-sans"
                >{{ $p.time }}</span
              >{{ end }}
            </div>
          </a>
        </li>
        {{ end }}
      </ol>
    </section>
  </div>
</aside>
{{ end }}
