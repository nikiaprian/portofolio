{{ define "client-content" }}
<section style="max-width: 420px; margin: 3rem auto; padding: 2rem; border-radius: 0.75rem; border: 1px solid var(--border); background: var(--surface); box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); color: var(--text); font-family: var(--font, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);">
  <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 1.5rem; text-align: center; color: var(--text);">
    Login
  </h1>

  <form id="login-form" style="display: flex; flex-direction: column; gap: 1rem;">
    <div style="display: flex; flex-direction: column; gap: 0.35rem;">
      <label for="email" style="font-size: 0.875rem; font-weight: 600; color: var(--muted);">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        autocomplete="email"
        placeholder="you@example.com"
        style="padding: 0.625rem 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.95rem; outline: none; transition: border-color 0.15s, box-shadow 0.15s;"
        onfocus="this.style.borderColor='var(--accent)'; this.style.boxShadow='0 0 0 1px var(--accent)';"
        onblur="this.style.borderColor='var(--border)'; this.style.boxShadow='none';"
      />
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.35rem;">
      <label for="password" style="font-size: 0.875rem; font-weight: 600; color: var(--muted);">Password</label>
      <div style="display: flex; gap: 0.4rem; align-items: stretch;">
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          placeholder="••••••••"
          style="flex: 1; min-width: 0; padding: 0.625rem 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.95rem; outline: none; transition: border-color 0.15s, box-shadow 0.15s;"
          onfocus="this.style.borderColor='var(--accent)'; this.style.boxShadow='0 0 0 1px var(--accent)';"
          onblur="this.style.borderColor='var(--border)'; this.style.boxShadow='none';"
        />
        <button
          type="button"
          class="tirtayasa-pw-toggle-btn"
          data-tirtayasa-pw-toggle="password"
          aria-label="Show password"
          style="flex-shrink: 0; padding: 0 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; min-width: 2.5rem;"
        >
          <i class="bi bi-eye" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <button
      type="submit"
      style="margin-top: 0.5rem; padding: 0.7rem 0.75rem; border-radius: 999px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: white; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: filter 0.15s, transform 0.05s;"
      onmouseover="this.style.filter='brightness(1.05)';"
      onmouseout="this.style.filter='none'; this.style.transform='none';"
      onmousedown="this.style.transform='scale(0.97)';"
      onmouseup="this.style.transform='none';"
    >
      Sign in
    </button>

    <div id="login-message" class="notice" style="display:none; margin-top:0.5rem; margin-bottom:0; font-size:0.88rem;"></div>
  </form>
</section>

<style>
  #email::placeholder,
  #password::placeholder {
    color: var(--muted);
    opacity: 0.85;
  }
</style>

<script>
  (function () {
    const form = document.getElementById("login-form");
    const messageEl = document.getElementById("login-message");
    const submitBtn = form ? form.querySelector('button[type="submit"]') : null;
    const localePrefix = "{{ if .locale_prefix }}{{ js .locale_prefix }}{{ else }}{{ end }}";

    if (!form) return;

    function withPrefix(path) {
      const base = String(localePrefix || "").replace(/\/+$/, "");
      if (!path || path === "/") return base || "/";
      if (path.charAt(0) !== "/") path = "/" + path;
      return (base || "") + path;
    }

    function showMessage(type, text) {
      if (!messageEl) return;
      messageEl.className = "notice";
      if (type === "success") messageEl.classList.add("notice-success");
      else if (type === "error") messageEl.classList.add("notice-error");
      else messageEl.classList.add("notice-info");
      messageEl.style.display = "block";
      messageEl.textContent = text || "";
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      if (submitBtn) submitBtn.disabled = true;
      showMessage("info", "Signing in...");

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch(withPrefix("/api/v1/auth/login"), {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          const errMsg = data && data.error ? data.error : "Sign-in failed. Check your email and password.";
          showMessage("error", errMsg);
          return;
        }

        // Persist token for API calls and admin page middleware checks.
        if (data.token) {
          try {
            localStorage.setItem("tirtayasa_token", data.token);
            sessionStorage.setItem("tirtayasa_token", data.token);
            document.cookie =
              "tirtayasa_token=" + encodeURIComponent(data.token) + "; Path=/; SameSite=Lax";
          } catch (e) {
            // ignore storage errors
          }
        }
        if (data.user && data.user.id != null) {
          try {
            localStorage.setItem("tirtayasa_user_id", String(data.user.id));
            localStorage.setItem("tirtayasa_user", JSON.stringify(data.user));
            sessionStorage.setItem("tirtayasa_user", JSON.stringify(data.user));
          } catch (e) {
            // ignore storage errors
          }
        }

        showMessage("success", "Signed in. Redirecting...");

        try {
          var flash = {
            name: data.user && data.user.name ? data.user.name : "",
            email: data.user && data.user.email ? data.user.email : "",
          };
          sessionStorage.setItem("tirtayasa_login_flash", JSON.stringify(flash));
        } catch (e) {
          /* ignore */
        }

        window.location.href = withPrefix("/admin/dashboard");
      } catch (err) {
        showMessage("error", "A network error occurred. Please try again.");
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    });
  })();
</script>
<script
  defer
  src="{{ .public_base }}/static/js/password-reveal.js{{- if .static_version -}}?v={{ .static_version }}{{- end -}}"
></script>
{{ end }}
