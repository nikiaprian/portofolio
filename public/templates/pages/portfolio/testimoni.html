{{ define "pf-main" }}
<section class="pf-band">
  <div class="pf-wrap">
    <p class="pf-kicker">Ulasan</p>
    <h1 class="pf-list-title">Testimoni</h1>
    <p class="pf-lead">Pengalaman orang yang sudah memakai alamat portfolio mereka.</p>
    <div class="pf-quotes pf-quotes-page">
      {{ range .Quotes }}
      <article class="pf-quote">
        <p>{{ .Quote }}</p>
        <strong>{{ .Name }}</strong>
        <span>{{ .Role }}</span>
      </article>
      {{ end }}
    </div>
    <div class="pf-actions"><a class="pf-btn" href="/produk">Pilih template</a></div>
  </div>
</section>
{{ end }}
