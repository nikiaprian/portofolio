{{ define "pf-main" }}
<h1>Atur password</h1>
{{ if .Error }}<p class="pf-error">{{ .Error }}</p>{{ end }}
{{ if .Already }}
  <p>Password sudah diatur.</p>
  <a class="pf-btn" href="/kelola/masuk">Masuk</a>
{{ else }}
  <form class="pf-form" method="post" action="/kelola/atur-password/{{ .Token }}">
    <label>Password baru<input name="password" type="password" required minlength="8" maxlength="72" /></label>
    <button class="pf-btn" type="submit">Simpan password</button>
  </form>
{{ end }}
{{ end }}
