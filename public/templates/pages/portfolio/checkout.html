{{ define "pf-main" }}
<div class="pf-split pf-checkout">
  <div>
    <p class="pf-kicker">Checkout</p>
    <h1>Ambil subdomain Anda.</h1>
    <p class="pf-lead">Situs tampil dengan nama yang Anda pilih.</p>
  </div>
  <form class="pf-form pf-card" method="post" action="/beli">
    {{ if .Error }}<p class="pf-error">{{ .Error }}</p>{{ end }}
    <label>Nama<input name="name" required maxlength="100" value="{{ .Name }}" /></label>
    <label>Email<input name="email" type="email" required maxlength="150" value="{{ .Email }}" /></label>
    <label>WhatsApp<input name="whatsapp" required inputmode="tel" value="{{ .WhatsApp }}" placeholder="08…" /></label>
    <label>Subdomain
      <input name="subdomain" required minlength="3" maxlength="30" pattern="[a-z0-9][a-z0-9-]{1,28}[a-z0-9]" value="{{ .Subdomain }}" placeholder="namaanda" />
    </label>
    <p class="pf-help">Alamat: <strong id="pf-host">{{ if .Subdomain }}{{ .Subdomain }}{{ else }}nama{{ end }}.portofolioku.id</strong></p>
    <button class="pf-btn" type="submit">Lanjut Pembayaran</button>
  </form>
</div>
<script>
  var input = document.querySelector("[name=subdomain]");
  var host = document.getElementById("pf-host");
  var root = "portofolioku.id";
  if (input && host) {
    input.addEventListener("input", function () {
      var value = input.value.toLowerCase().replace(/[^a-z0-9-]/g, "");
      if (value !== input.value) {
        input.value = value;
      }
      host.textContent = (value || "nama") + "." + root;
    });
  }
</script>
{{ end }}
