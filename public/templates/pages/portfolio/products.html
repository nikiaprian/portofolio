{{ define "pf-main" }}
<div class="pf-product-page">
  <div class="pf-section-head">
    <p class="pf-kicker">Template</p>
    <h1 class="pf-list-title">Produk</h1>
    <p class="pf-lead">Klik kartu untuk membuka tampilan penuh di tab baru, seperti halaman yang pembeli terima.</p>
  </div>
  <div class="pf-product-grid">
    {{ range .Products }}{{ template "pf-product-card" . }}{{ end }}
  </div>
</div>
{{ end }}
