{{ define "admin-category-delete" }}

<div
  class="modal fade admin-crud-modal admin-crud-modal--danger"
  id="modalCategoryDelete"
  tabindex="-1"
  aria-labelledby="modalCategoryDeleteLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header align-items-start">
        <div class="d-flex gap-3 pe-2">
          <div
            class="admin-crud-modal__icon admin-crud-modal__icon--danger"
            aria-hidden="true"
          >
            <i class="bi bi-trash3"></i>
          </div>
          <div>
            <h5 class="modal-title text-danger" id="modalCategoryDeleteLabel">
              Hapus Category
            </h5>
            <p class="small text-secondary mb-0 mt-1 lh-sm">
              Tindakan ini tidak bisa dibatalkan.
            </p>
          </div>
        </div>
        <button
          type="button"
          class="btn-close ms-auto flex-shrink-0 mt-1"
          data-bs-dismiss="modal"
          aria-label="Tutup"
        ></button>
      </div>
      <div class="modal-body pt-0">
        <div
          id="category-delete-error"
          class="alert alert-danger d-none py-2 small"
          role="alert"
        ></div>
        <p class="small text-secondary mb-3">
          Anda akan menghapus Category ini:
        </p>
        <dl class="admin-crud-delete-summary mb-0">
          <div>
            <dt>ID</dt>
            <dd id="cd-id"></dd>
          </div>
          <div>
            <dt>Nama</dt>
            <dd id="cd-name"></dd>
          </div>
          <div>
            <dt>Slug</dt>
            <dd id="cd-slug" class="font-monospace"></dd>
          </div>
          <div>
            <dt>Judul</dt>
            <dd id="cd-title"></dd>
          </div>
          <div>
            <dt>Kata kunci</dt>
            <dd id="cd-keyword"></dd>
          </div>
          <div>
            <dt>Meta deskripsi</dt>
            <dd id="cd-description"></dd>
          </div>
        </dl>
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">
          Batal
        </button>
        <button type="button" class="btn btn-danger px-4" id="cd-confirm">
          <i class="bi bi-trash3 me-1"></i> Hapus permanen
        </button>
      </div>
    </div>
  </div>
</div>

{{ end }}
