{{ define "admin-user-edit" }}

<div
  class="modal fade admin-crud-modal"
  id="modalUserEdit"
  tabindex="-1"
  aria-labelledby="modalUserEditLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header align-items-start">
        <div class="d-flex gap-3 pe-2">
          <div
            class="admin-crud-modal__icon admin-crud-modal__icon--info"
            aria-hidden="true"
          >
            <i class="bi bi-pencil-square"></i>
          </div>
          <div>
            <h5 class="modal-title" id="modalUserEditLabel">Edit User</h5>
            <p class="small text-secondary mb-0 mt-1 lh-sm">
              Perbarui profil dan kata sandi jika diperlukan.
            </p>
          </div>
        </div>
        <button
          type="button"
          class="btn-close ms-auto flex-shrink-0 mt-1"
          data-bs-dismiss="modal"
          aria-label="Tutup"
        ></button>
      </div>
      <form id="form-user-edit">
        <input type="hidden" id="ue-id" />
        <div class="modal-body pt-0 mt-3">
          <div
            id="user-edit-error"
            class="alert alert-danger d-none py-2 small mb-3"
            role="alert"
          ></div>
          <div class="row g-3">
            <div class="col-12">
              <div class="d-flex justify-content-center mb-1">
                <img
                  id="ue-image-preview"
                  src=""
                  alt="Pratinjau profil"
                  class="rounded-circle border"
                  style="width: 88px; height: 88px; object-fit: cover"
                />
              </div>
              <div class="border rounded overflow-hidden">
                <ul
                  class="nav nav-tabs border-bottom-0 px-2 pt-2 mb-0 gap-1 flex-nowrap"
                  id="ue-image-tabs"
                  role="tablist"
                >
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link active small py-2 px-3"
                      id="ue-image-upload-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#ue-image-upload-pane"
                      type="button"
                      role="tab"
                      aria-controls="ue-image-upload-pane"
                      aria-selected="true"
                    >
                      Unggah
                    </button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link small py-2 px-3"
                      id="ue-image-url-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#ue-image-url-pane"
                      type="button"
                      role="tab"
                      aria-controls="ue-image-url-pane"
                      aria-selected="false"
                    >
                      URL
                    </button>
                  </li>
                </ul>
                <div
                  class="tab-content border-top p-3 bg-body-tertiary bg-opacity-25"
                >
                  <div
                    class="tab-pane fade show active"
                    id="ue-image-upload-pane"
                    role="tabpanel"
                    aria-labelledby="ue-image-upload-tab"
                    tabindex="0"
                  >
                    <label for="ue-image-file" class="form-label"
                      >Unggah gambar</label
                    >
                    <input
                      type="file"
                      class="form-control"
                      id="ue-image-file"
                      name="image_file"
                      accept="image/*"
                    />
                  </div>
                  <div
                    class="tab-pane fade"
                    id="ue-image-url-pane"
                    role="tabpanel"
                    aria-labelledby="ue-image-url-tab"
                    tabindex="0"
                  >
                    <label for="ue-image" class="form-label">URL gambar</label>
                    <input
                      type="url"
                      class="form-control"
                      id="ue-image"
                      name="image"
                      placeholder="https://..."
                    />
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <label for="ue-name" class="form-label">
                Nama lengkap <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text border-end-0">
                  <i class="bi bi-person"></i>
                </span>
                <input
                  type="text"
                  class="form-control border-start-0 ps-0"
                  id="ue-name"
                  placeholder="Jane Doe"
                  required
                  autocomplete="name"
                />
              </div>
            </div>
            <div class="col-md-6">
              <label for="ue-email" class="form-label">
                Email <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text border-end-0">
                  <i class="bi bi-envelope"></i>
                </span>
                <input
                  type="email"
                  class="form-control border-start-0 ps-0"
                  id="ue-email"
                  placeholder="name@example.com"
                  required
                  autocomplete="email"
                />
              </div>
            </div>
            <div class="col-md-6">
              <label for="ue-username" class="form-label">Nama pengguna</label>
              <div class="input-group">
                <span class="input-group-text border-end-0">
                  <i class="bi bi-at"></i>
                </span>
                <input
                  type="text"
                  class="form-control border-start-0 ps-0"
                  id="ue-username"
                  placeholder="jane-doe"
                  autocomplete="username"
                />
              </div>
            </div>
            <div class="col-md-3">
              <label for="ue-role" class="form-label">
                Peran <span class="text-danger">*</span>
              </label>
              <select class="form-select" id="ue-role" name="role" required>
                <option value="writer">Penulis</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="col-md-3 d-flex align-items-end js-user-enabled-wrap">
              <div class="form-check form-switch mb-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="ue-enabled"
                />
                <label class="form-check-label" for="ue-enabled">Aktif</label>
                <div class="form-text">Pengguna nonaktif tidak bisa masuk.</div>
              </div>
            </div>
            <div class="col-12">
              <label for="ue-profile" class="form-label">Profil</label>
              <textarea
                class="form-control"
                id="ue-profile"
                name="profile"
                rows="3"
              ></textarea>
            </div>
            <div class="col-12">
              <label for="ue-password" class="form-label"
                >Kata sandi baru (opsional)</label
              >
              <div class="input-group">
                <span class="input-group-text border-end-0">
                  <i class="bi bi-key"></i>
                </span>
                <input
                  type="password"
                  class="form-control border-start-0 ps-0"
                  id="ue-password"
                  placeholder="Kosongkan jika tidak ingin mengubah"
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  data-tirtayasa-pw-toggle="ue-password"
                  aria-label="Tampilkan kata sandi"
                >
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
              </div>
              <div class="form-text">
                Kosongkan jika ingin tetap memakai kata sandi saat ini.
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer justify-content-between">
          <button
            type="button"
            class="btn btn-light border"
            data-bs-dismiss="modal"
          >
            Batal
          </button>
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-1"></i> Simpan perubahan
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{{ end }}
