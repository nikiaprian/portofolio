# Air live-reload for bebii-blog (entrypoint: ./cmd)
root = "."
tmp_dir = "tmp"

[build]
  # Package lives under cmd/, not repo root.
  cmd = "go build -o ./tmp/main ./cmd"
  bin = "./tmp/main"
  full_bin = "./tmp/main"
  delay = 800
  exclude_dir = ["tmp", "vendor", "node_modules", "data", "public/uploads", "public/vendor", "release", ".git"]
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true
  follow_symlink = false
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "2s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false
